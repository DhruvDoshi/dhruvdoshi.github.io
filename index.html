    <meta charset="UTF-8" />

    <meta name="description" content="Dhruv Doshi is a staff software developer and enterprise architect building reliable platforms, developer tools, and observable systems." />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      (() => {
        const redirectedPath = sessionStorage.getItem('spa-redirect');
        if (redirectedPath) {
          sessionStorage.removeItem('spa-redirect');
          history.replaceState(null, '', redirectedPath);
        }
        const stored = localStorage.getItem('theme');
        const theme = stored || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Instrument+Sans:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;display=swap" rel="stylesheet" />
