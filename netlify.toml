[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  NPM_VERSION = "10"

[context.production.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "https://blog.doshidhruv.com/posts/*"
  to = "https://doshidhruv.com/notes/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://blog.doshidhruv.com/*"
  to = "https://doshidhruv.com/notes"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
